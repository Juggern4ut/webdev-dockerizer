server {
    listen 80;
    server_name jm.local;

    location ~ ^/(cp|api|assets) {
        resolver 127.0.0.11 valid=10s;
        set $upstream http://apache-johannesmueller:80;
        proxy_pass $upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/(|_nuxt|__nuxt|\.nuxt) {
        resolver 127.0.0.11 valid=10s;
        set $upstream http://nuxt-johannesmueller:3000;
        proxy_pass $upstream;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 443 ssl;
    server_name jm.local;

    ssl_certificate /etc/nginx/ssl/jm.local.pem;
	ssl_certificate_key /etc/nginx/ssl/jm.local-key.pem;

    location ~ ^/(cp|api|assets) {
        resolver 127.0.0.11 valid=10s;
        set $upstream http://apache-johannesmueller:80;
        proxy_pass $upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/(|_nuxt|__nuxt|\.nuxt) {
        resolver 127.0.0.11 valid=10s;
        set $upstream http://nuxt-johannesmueller:3000;
        proxy_pass $upstream;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header X-Real-IP $remote_addr;
    }
}
